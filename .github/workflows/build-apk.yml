name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:   # omogoci rocni zagon z gumbom "Run workflow"

jobs:
  build:
    runs-on: ubuntu-24.04   # fiksna verzija, da se gradnja ne spremeni ob selitvi "latest"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Gradle namestimo kar tukaj, zato v repozitoriju ni potreben gradlew
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v6
        with:
          name: photoframe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
